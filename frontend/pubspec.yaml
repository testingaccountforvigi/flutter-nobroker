name: cross_platform
description: "NoBroker Owner Listings - Direct property marketplace"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # Networking
  dio: ^5.7.0
  socket_io_client: ^2.0.3+1

  # Code Generation
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Local Storage
  drift: ^2.20.1
  drift_flutter: ^0.2.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # UI Components
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1
  phosphor_flutter: ^2.1.0
  image_picker: ^1.0.7

  # LiveKit
  livekit_client: ^2.2.5

  # PDF & Signature
  pdf: ^3.11.1
  printing: ^5.13.2
  signature: ^5.5.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.0
  logger: ^2.4.0
  url_launcher: ^6.3.1

  # Animation (minimal usage)
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  
  # Code Generation
  build_runner: ^2.4.12
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  drift_dev: ^2.20.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
